workflows:
  lataxi-app:
    name: LaTaxi App
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Build LaTaxi
        script: |
          cd LaTaxi
          ./gradlew assembleDebug
    artifacts:
      - LaTaxi/app/build/outputs/apk/debug/*.apk

  lataxidriver-app:
    name: LaTaxiDriver App
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      java: 11
    scripts:
      - name: Build LaTaxiDriver
        script: |
          cd LaTaxiDriver
          ./gradlew assembleDebug
    artifacts:
      - LaTaxiDriver/app/build/outputs/apk/debug/*.apk
