workflows:
  android-workflow:
    name: Android Simple Driver - Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "in.techware.lataxidriver"
        # Add your Google Maps API key here or as a secure variable
        GOOGLE_MAPS_API_KEY: $GOOGLE_MAPS_API_KEY
      java: 17
      android_sdk: default
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'v1'
          include: true
        - pattern: 'main'
          include: true
        - pattern: 'release/*'
          include: true
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "✅ Local properties configured"
      
      - name: Set Google Maps API Key
        script: |
          if [ ! -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Setting Google Maps API key..."
            sed -i.bak "s/YOUR_API_KEY_HERE/$GOOGLE_MAPS_API_KEY/g" app/src/main/res/values/strings.xml
          fi
      
      - name: Check Gradle configuration
        script: | 
          echo "📱 Gradle Configuration:"
          ./gradlew --version
          ./gradlew dependencies --configuration implementation | head -100
      
      - name: Clean project
        script: |
          ./gradlew clean
          echo "✅ Project cleaned"
      
      - name: Build Android AAB (Release)
        script: | 
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=internal,alpha,beta,production || echo "0")
          
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ] || [ "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" = "0" ]; then
              echo "⚠️ No existing build found on Google Play, starting from 10"
              UPDATED_BUILD_NUMBER=10
          else
              UPDATED_BUILD_NUMBER=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
              echo "📈 Latest build on Google Play: $LATEST_GOOGLE_PLAY_BUILD_NUMBER"
          fi
          
          echo "🔨 Building release with versionCode: $UPDATED_BUILD_NUMBER"
          ./gradlew bundleRelease \
            -PversionCode=$UPDATED_BUILD_NUMBER \
            -PversionName="1.0.$UPDATED_BUILD_NUMBER" \
            --stacktrace \
            --console=plain
          
          echo "✅ AAB Build completed successfully!"
          echo "📊 Build Details:"
          echo "   - Version Code: $UPDATED_BUILD_NUMBER"
          echo "   - Version Name: 1.0.$UPDATED_BUILD_NUMBER"
      
      - name: Build APK for Testing
        script: |
          ./gradlew assembleRelease \
            --stacktrace \
            --console=plain
          echo "✅ APK Build completed!"
          
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/mapping.txt
      - app/build/reports/**
      
    publishing:
      email:
        recipients:
          - jclouds312@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
        changes_not_sent_for_review: true
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:912563974727:android:a351d01700cb9d0957f762
          groups:
            - testers
          artifact_type: apk

  android-debug-workflow:
    name: Android Simple Driver - Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "in.techware.lataxidriver"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
        - pattern: 'feature/*'
          include: true
        - pattern: 'replit-agent'
          include: true
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      
      - name: Clean project
        script: |
          ./gradlew clean
      
      - name: Build debug APK
        script: | 
          ./gradlew assembleDebug --stacktrace --console=plain
          echo "✅ Debug APK generated successfully!"
          
      - name: Run unit tests
        script: |
          ./gradlew test || echo "⚠️ Some tests failed, check reports"
          
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/reports/**/*
      - app/build/test-results/**/*
      
    publishing:
      email:
        recipients:
          - jclouds312@gmail.com
        notify:
          success: true
          failure: true
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:912563974727:android:a351d01700cb9d0957f762
          groups:
            - testers
          artifact_type: apk

  production-deployment:
    name: Production Release to Google Play
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play
        - production_secrets
      vars:
        PACKAGE_NAME: "in.techware.lataxidriver"
      java: 17
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      
      - name: Build Production AAB
        script: | 
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=production)
          UPDATED_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          
          ./gradlew bundleRelease \
            -PversionCode=$UPDATED_BUILD_NUMBER \
            -PversionName="1.1.$UPDATED_BUILD_NUMBER" \
            --stacktrace
            
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
      
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false
        rollout_fraction: 0.1  # 10% gradual rollout