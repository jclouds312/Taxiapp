workflows:
    android-app:
        name: Android App
        environment:
            groups:
                - google-services
            android_signing:
                - keystore_reference
            vars:
                PACKAGE_NAME: "in.techware.lataxidriver"
        triggering:
            events:
                - push
            branch_patterns:
                - pattern: 'main'
                  include: true
                  source: true
        scripts:
            - name: Set up local properties
              script: |
                echo "sdk.dir=$ANDROID_SDK_ROOT" > "$FCI_BUILD_DIR/local.properties"
            - name: Set up google-services.json
              script: |
                echo $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS > $FCI_BUILD_DIR/app/google-services.json
            - name: Build Android app
              script: |
                ./gradlew assembleRelease
        artifacts:
            - app/build/outputs/apk/release/app-release.apk