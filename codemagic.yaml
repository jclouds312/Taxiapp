workflows:
  android-passenger-workflow:
    name: Android Passenger App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      # android_signing:
      #   - keystore_reference
      vars:
        PACKAGE_NAME: "in.techware.lataxipassenger"
      java: 11
    scripts:
      - name: Set up local.properties
        script: | 
          cd "Source Codes/LaTaxi"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Get Gradle version
        script: | 
          cd "Source Codes/LaTaxi"
          ./gradlew --version
      - name: Build Android APK
        script: | 
          cd "Source Codes/LaTaxi"
          UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          ./gradlew assembleRelease -PversionCode=$UPDATED_BUILD_NUMBER -PversionName=1.0.$UPDATED_BUILD_NUMBER
    artifacts:
      - Source Codes/LaTaxi/app/build/outputs/**/*.apk
      - Source Codes/LaTaxi/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  android-passenger-debug:
    name: Android Passenger Debug Build (Fast)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 11
    scripts:
      - name: Set up local.properties
        script: | 
          cd "Source Codes/LaTaxi"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build debug APK
        script: | 
          cd "Source Codes/LaTaxi"
          ./gradlew assembleDebug
    artifacts:
      - Source Codes/LaTaxi/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
