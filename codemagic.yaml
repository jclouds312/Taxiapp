workflows:
  android-workflow:
    name: Android Simple Driver Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      # android_signing:
      #   - keystore_reference
      # groups:
      #   - google_play
      vars:
        PACKAGE_NAME: "in.techware.lataxidriver"
      java: 11
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Get Flutter packages
        script: | 
          echo "Using Gradle wrapper version"
          ./gradlew --version
      - name: Build Android release
        script: | 
          # Usar BUILD_NUMBER de CodeMagic en lugar de Google Play
          UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          cd . && ./gradlew bundleRelease -PversionCode=$UPDATED_BUILD_NUMBER -PversionName=1.0.$UPDATED_BUILD_NUMBER
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  android-debug-workflow:
    name: Android Debug Build (Fast)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 11
      vars:
        PACKAGE_NAME: "in.techware.lataxidriver"
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: | 
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
