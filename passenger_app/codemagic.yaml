workflows:
  passenger-release-workflow:
    name: Passenger App - Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      # android_signing:
      #   - passenger_keystore  # Uncomment and configure in CodeMagic UI
      # groups:
      #   - google_play_passenger  # Uncomment when you have Play Store credentials
      vars:
        PACKAGE_NAME: "in.techware.lataxipassenger"
        APP_NAME: "Simple Passenger"
        GOOGLE_MAPS_API_KEY: $GOOGLE_MAPS_API_KEY
      java: 17
      android_sdk: default
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'passenger-main'
          include: true
        - pattern: 'passenger-release/*'
          include: true
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "✅ Local properties configured"
      
      - name: Set Google Maps API Key
        script: |
          if [ ! -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Setting Google Maps API key..."
            sed -i.bak "s/YOUR_GOOGLE_MAPS_API_KEY_HERE/$GOOGLE_MAPS_API_KEY/g" app/src/main/res/values/strings.xml
          fi
      
      - name: Clean project
        script: |
          ./gradlew clean
          echo "✅ Project cleaned"
      
      - name: Build Passenger AAB
        script: | 
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=internal,alpha,beta,production || echo "0")
          
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" = "0" ]; then
              echo "⚠️ No existing build found, starting from 1"
              UPDATED_BUILD_NUMBER=1
          else
              UPDATED_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          fi
          
          echo "🔨 Building release with versionCode: $UPDATED_BUILD_NUMBER"
          ./gradlew bundleRelease \
            -PversionCode=$UPDATED_BUILD_NUMBER \
            -PversionName="1.0.$UPDATED_BUILD_NUMBER" \
            --stacktrace \
            --console=plain
          
          echo "✅ AAB Build completed!"
      
      - name: Build APK for Testing
        script: |
          ./gradlew assembleRelease --stacktrace --console=plain
          echo "✅ APK Build completed!"
          
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/mapping.txt
      
    publishing:
      email:
        recipients:
          - jclouds312@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
        changes_not_sent_for_review: true
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:912563974727:android:PASSENGER_APP_ID_HERE
          groups:
            - passenger_testers
          artifact_type: apk

  passenger-debug-workflow:
    name: Passenger App - Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "in.techware.lataxipassenger"
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      
      - name: Clean project
        script: |
          ./gradlew clean
      
      - name: Build debug APK
        script: | 
          ./gradlew assembleDebug --stacktrace --console=plain
          echo "✅ Debug APK generated!"
          
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/reports/**/*
      
    publishing:
      email:
        recipients:
          - jclouds312@gmail.com
        notify:
          success: true
          failure: true